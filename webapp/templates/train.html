
{% extends "base.html" %} 

  {% block content %}

  <div class="container">
      <br><br>
      <form class="form-horizontal" action="/submit" method="post" enctype="multipart/form-data">

        <div class="form-group">
          <label class="control-label col-sm-2" for="pwd"> • Upload Test Data :</label>
          
          <br>

          <div class="col-sm-15">          
            <input type="file" class="form-control" placeholder="Hours Studied"  name="my_image" id="pwd">
          </div>
        </div>

        <br>

        <div class="form-group">
            <label class="control-label col-sm-2" for="pwd"> • Upload Train Data :</label>
            
            <br>
  
            <div class="col-sm-15">          
              <input type="file" class="form-control" placeholder="Hours Studied"  name="my_image" id="pwd">
            </div>
          </div>
  
          <br>

        <label class="control-label col-sm-2" for="pwd"> • Model Type : </label>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
          <label class="form-check-label" for="flexRadioDefault1">Self Organized Map Model</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
          <label class="form-check-label" for="flexRadioDefault2">Clustring Model</label>
        </div>

        <br>

        <div class="form-group">        
          <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-success">Train</button>
          </div>
        </div>
      </form>

      <br>
      
      <br>

    </div>
  {% endblock %}
